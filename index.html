<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator project</title>
</head>
<body>
    <!--the left hand side of the calculator -->
    <div class="left-side">
        <header>
            <p>Calculator</p>
        </header>

        <!--the calculator screen -->
        <div class="calc-screen">
            <p>0</p>
            <p>0</p>
        </div>

        <!-- the calculator buttons -->
        <div class="buttons">
            <img src="./calculator_assets/clear.svg" class="special-style">
            <img src="./calculator_assets/divide.svg" class="special-style">
            <img src="./calculator_assets/multiply.svg" class="special-style">
            <img src="./calculator_assets/backspace.svg" class="special-style">
        </div>

        <div class="buttons">
            <p>7</p>
            <p>8</p>
            <p>9</p>
            <p>-</p>
        </div>

        <div class="buttons">
            <p>4</p>
            <p>5</p>
            <p>6</p>
            <p>+</p>
        </div>

        <div class="buttons">
            <p>1</p>
            <p>2</p>
            <p>3</p>
            <p>=</p>
        </div>

        <div class="buttons">
            <p>%</p>
            <p>0</p>
            <p>.</p>
        </div>
    </div>

    <!-- the right hand side of the calculator, showing the history-->
     <div class="right-side">
        <div class="right-side-header">
            <p>History</p>
            <p>X Clear</p>
        </div>

        <div class="history-section">
            <p>8:15am</p>
            <div class="result">
                <p>234</p>
                <p>261</p>
            </div>
        </div>

        <div class="history-section">
            <p>8:15am</p>
            <div class="result">
                <p>234</p>
                <p>261</p>
            </div>
        </div>

        <div class="history-section">
            <p>8:15am</p>
            <div class="result">
                <p>234</p>
                <p>261</p>
            </div>
        </div>

        <div class="history-section">
            <p>8:15am</p>
            <div class="result">
                <p>234</p>
                <p>261</p>
            </div>
        </div>

        <div class="history-section">
            <p>8:15am</p>
            <div class="result">
                <p>234</p>
                <p>261</p>
            </div>
        </div>
     </div>
</body>
</html>
